[package]
name = "backup-sync"
version = "3.0.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
chrono = "0.4"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
rand = "0.10"

[profile.release]
lto = true
